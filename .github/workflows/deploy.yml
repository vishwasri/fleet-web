name: Build & Deploy Fleet Web to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fleet-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-web:
    name: Build & Push Next.js Web Image
    runs-on: ubuntu-latest
    outputs:
      ghcr_owner: ${{ steps.meta.outputs.ghcr_owner }}
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase GHCR owner
        id: meta
        run: echo "ghcr_owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.ghcr_owner }}/fleet-web:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.ghcr_owner }}/fleet-web:latest
          cache-from: type=gha,scope=fleet-web
          cache-to: type=gha,mode=max,scope=fleet-web

  deploy-to-droplet:
    name: Deploy Web to DigitalOcean Droplet
    needs: build-and-push-web
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_PORT: ${{ secrets.DO_PORT }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.FLEET_DEPLOY_PATH }}
          GHCR_OWNER: ${{ needs.build-and-push-web.outputs.ghcr_owner }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          IMAGE_TAG: ${{ needs.build-and-push-web.outputs.image_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "$DO_HOST" ] || missing+=("DO_HOST")
          [ -n "$DO_USER" ] || missing+=("DO_USER")
          [ -n "$DO_SSH_KEY" ] || missing+=("DO_SSH_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

          SSH_PORT="${DO_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/fleet}"
          cleanup() { rm -f "$HOME/.ssh/fleet_deploy_key"; }
          trap cleanup EXIT
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DO_SSH_KEY" > "$HOME/.ssh/fleet_deploy_key"
          chmod 600 "$HOME/.ssh/fleet_deploy_key"
          if [ -n "$DO_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DO_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$SSH_PORT" -H "$DO_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

          SSH_OPTS=(-i "$HOME/.ssh/fleet_deploy_key" -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15)

          REGISTRY_TOKEN="${GHCR_PULL_TOKEN:-$GITHUB_TOKEN}"
          REGISTRY_USER="${GHCR_PULL_USER:-$GITHUB_ACTOR}"
          printf '%s\n' "$REGISTRY_TOKEN" | ssh "${SSH_OPTS[@]}" "$DO_USER@$DO_HOST" "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"

          ssh "${SSH_OPTS[@]}" "$DO_USER@$DO_HOST" bash -s -- "$DEPLOY_PATH" "$GHCR_OWNER" "$IMAGE_TAG" <<'EOF'
          set -euo pipefail
          path="$1"
          owner="$2"
          tag="$3"
          cd "$path"

          # Update WEB_IMAGE_TAG in .env if present
          if [ -f .env ]; then
            grep -v -E '^WEB_IMAGE_TAG=' .env > .env.tmp || true
            { [ -s .env.tmp ] && awk '1' .env.tmp; printf 'WEB_IMAGE_TAG=%s\n' "$tag"; } > .env
            rm -f .env.tmp
            chmod 600 .env
          fi

          # Clean up any stale recreate containers or dead containers before recreating services
          echo "Cleaning up any stale or conflicting containers..."
          docker ps -a --format '{{.ID}} {{.Names}}' | grep -E '_fleet-(api|web|nginx|mysql)' | awk '{print $1}' | xargs -r docker rm -f 2>/dev/null || true
          docker container prune -f 2>/dev/null || true

          # Pull updated images and bring up the web container
          docker compose pull web

          # Ensure api service is up without recreating it if it is already running
          if ! docker compose ps --status running --services | grep -qx api; then
            echo "API service is not running; starting dependencies..."
            docker compose up -d api
          fi

          # Bring up web container without recreating dependencies
          if ! docker compose up -d --no-deps web; then
            echo "Initial up failed. Cleaning up conflicting containers and forcing recreate..."
            docker ps -a --format '{{.ID}} {{.Names}}' | grep -E '_fleet-(api|web|nginx|mysql)' | awk '{print $1}' | xargs -r docker rm -f 2>/dev/null || true
            docker compose rm -f -s web 2>/dev/null || true
            docker compose up -d --no-deps --force-recreate web
          fi

          docker compose exec -T nginx nginx -s reload || docker compose restart nginx

          echo "Waiting for Web service to be healthy..."
          for i in $(seq 1 30); do
            if docker compose ps --status running --services | grep -qx web; then
              echo "Fleet Web is up and running."
              docker compose ps
              docker image prune -f >/dev/null 2>&1 || true
              exit 0
            fi
            sleep 2
          done
          echo "Fleet Web container failed to start. Logs:" >&2
          docker compose logs web --tail=50 >&2
          exit 1
          EOF
